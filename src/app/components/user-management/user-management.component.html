<div class="min-h-screen bg-gray-50 p-6">
  <div class="mx-auto max-w-6xl">
    
    <!-- 標頭與功能列 -->
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">會員管理系統</h1>
        <p class="text-sm text-gray-500">管理平台所有註冊會員之權限與啟用狀態</p>
      </div>
      <div class="flex gap-3">
        <button
          (click)="loadUsers()"
          class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"
        >
          重新整理
        </button>
        <button
          (click)="onLogout()"
          class="rounded-lg bg-red-600 px-4 py-2 text-sm text-white hover:bg-red-700"
        >
          登出
        </button>
      </div>
    </div>

    <!-- 訊息提示欄 -->
    <div *ngIf="successMessage" class="mb-4 rounded-lg bg-green-100 p-4 text-green-700">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 rounded-lg bg-red-100 p-4 text-red-700">
      {{ errorMessage }}
    </div>

    <!-- 會員列表表格 -->
    <div class="overflow-hidden rounded-lg bg-white shadow">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">姓名</th>
            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">Email</th>
            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">角色</th>
            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">狀態</th>
            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">註冊時間</th>
            <th class="px-6 py-3 text-right text-xs font-medium uppercase tracking-wider text-gray-500">操作</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-200 bg-white">
          <!-- 載入中狀態 -->
          <tr *ngIf="isLoading">
            <td colspan="6" class="px-6 py-8 text-center text-gray-500">資料載入中...</td>
          </tr>

          <!-- 查無資料狀態 -->
          <tr *ngIf="!isLoading && users.length === 0">
            <td colspan="6" class="px-6 py-8 text-center text-gray-500">目前尚無會員資料</td>
          </tr>

          <!-- 會員資料列 -->
          <tr *ngFor="let user of users" class="hover:bg-gray-50">
            <td class="whitespace-nowrap px-6 py-4 font-medium text-gray-900">{{ user.fullName }}</td>
            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-600">{{ user.email }}</td>
            <td class="whitespace-nowrap px-6 py-4 text-sm">
              <span [class]="user.role === 'Admin' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'" class="rounded-full px-2.5 py-0.5 text-xs font-semibold">
                {{ user.role }}
              </span>
            </td>
            <td class="whitespace-nowrap px-6 py-4 text-sm">
              <span [class]="user.isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'" class="rounded-full px-2.5 py-0.5 text-xs font-semibold">
                {{ user.isActive ? '啟用' : '停用' }}
              </span>
            </td>
            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500">
              {{ user.createdAt | date:'yyyy-MM-dd HH:mm' }}
            </td>
            <td class="whitespace-nowrap px-6 py-4 text-right text-sm font-medium">
              <!-- 切換狀態按鈕 -->
              <button
                (click)="onToggleStatus(user)"
                class="mr-3 text-indigo-600 hover:text-indigo-900"
              >
                {{ user.isActive ? '停用' : '啟用' }}
              </button>
              <!-- 刪除按鈕 -->
              <button
                (click)="onDeleteUser(user)"
                class="text-red-600 hover:text-red-900"
              >
                刪除
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
