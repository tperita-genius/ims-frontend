<div class="flex min-h-screen items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
    <h2 class="mb-6 text-center text-2xl font-bold text-gray-800">建立新帳號</h2>

    <div *ngIf="successMessage" class="mb-4 rounded bg-green-100 p-3 text-sm text-green-700">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 rounded bg-red-100 p-3 text-sm text-red-700">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">姓名</label>
        <input
          type="text"
          formControlName="fullName"
          class="mt-1 w-full rounded-md border border-gray-300 p-2 focus:border-blue-500 focus:outline-none"
          placeholder="請輸入姓名"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          formControlName="email"
          class="mt-1 w-full rounded-md border border-gray-300 p-2 focus:border-blue-500 focus:outline-none"
          placeholder="your@email.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">密碼</label>
        <input
          type="password"
          formControlName="password"
          class="mt-1 w-full rounded-md border border-gray-300 p-2 focus:border-blue-500 focus:outline-none"
          placeholder="至少 6 個字元"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full rounded-md bg-green-600 py-2 text-white hover:bg-green-700 disabled:opacity-50"
      >
        {{ isLoading ? '註冊中...' : '註冊帳號' }}
      </button>

      <div class="mt-4 text-center text-sm text-gray-600">
        已有帳號？
        <a routerLink="/login" class="font-semibold text-blue-600 hover:underline">返回登入</a>
      </div>
    </form>
  </div>
</div>
