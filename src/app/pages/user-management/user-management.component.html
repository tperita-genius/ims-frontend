<div class="space-y-6">
  <!-- 頁面標頭與搜尋列 -->
  <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">會員管理</h1>
      <p class="text-sm text-slate-500">管理平台所有註冊會員之權限與啟用狀態</p>
    </div>

    <div class="flex items-center gap-3">
      <!-- 關鍵字搜尋 -->
      <div class="relative">
        <input
          type="text"
          placeholder="搜尋姓名或 Email..."
          (input)="onSearch($event)"
          class="w-64 rounded-xl border border-slate-300 bg-white px-4 py-2 pl-9 text-sm focus:border-indigo-500 focus:outline-none"
        />
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-2.5 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <button
        (click)="loadUsers()"
        class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition cursor-pointer"
      >
        重新整理
      </button>
    </div>
  </div>

  <!-- 操作提示訊息 Toast -->
  <div *ngIf="successMessage" class="rounded-xl bg-green-50 p-4 text-sm text-green-700 border border-green-200 flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
    </svg>
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="rounded-xl bg-red-50 p-4 text-sm text-red-700 border border-red-200">
    {{ errorMessage }}
  </div>

  <!-- 會員列表表格 -->
  <div class="overflow-hidden rounded-2xl bg-white shadow-sm border border-slate-200">
    <table class="w-full text-left text-sm text-slate-600">
      <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200">
        <tr>
          <th class="px-6 py-4 font-semibold">會員姓名</th>
          <th class="px-6 py-4 font-semibold">電子郵件</th>
          <th class="px-6 py-4 font-semibold">角色權限</th>
          <th class="px-6 py-4 font-semibold">帳號狀態</th>
          <th class="px-6 py-4 font-semibold">註冊時間</th>
          <th class="px-6 py-4 text-right font-semibold">操作</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-200">
        <tr *ngIf="isLoading">
          <td colspan="6" class="px-6 py-8 text-center text-slate-400">資料載入中...</td>
        </tr>

        <tr *ngIf="!isLoading && users.length === 0">
          <td colspan="6" class="px-6 py-8 text-center text-slate-400">目前尚無會員資料</td>
        </tr>

        <tr *ngFor="let item of users" class="hover:bg-slate-50 transition">
          <td class="px-6 py-4 font-semibold text-slate-800">{{ item.fullName }}</td>
          <td class="px-6 py-4 text-slate-600">{{ item.email }}</td>
          <td class="px-6 py-4">
            <span [class]="item.role === 'Admin' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'" class="rounded-lg px-2.5 py-1 text-xs font-semibold">
              {{ item.role }}
            </span>
          </td>
          <td class="px-6 py-4">
            <span [class]="item.isActive ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'" class="rounded-lg px-2.5 py-1 text-xs font-semibold">
              {{ item.isActive ? '正常啟用' : '已停用' }}
            </span>
          </td>
          <td class="px-6 py-4 text-slate-400 text-xs">
            {{ item.createdAt | date:'yyyy-MM-dd HH:mm' }}
          </td>
          <td class="px-6 py-4 text-right space-x-3">
            <!-- 狀態切換按鈕 -->
            <button
              (click)="onToggleStatus(item)"
              [class]="item.isActive ? 'text-amber-600 hover:text-amber-800' : 'text-emerald-600 hover:text-emerald-800'"
              class="font-medium cursor-pointer"
            >
              {{ item.isActive ? '停用帳號' : '啟用帳號' }}
            </button>

            <!-- 刪除按鈕 -->
            <button
              (click)="onDeleteUser(item)"
              class="text-red-600 hover:text-red-900 font-medium cursor-pointer"
            >
              刪除
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
