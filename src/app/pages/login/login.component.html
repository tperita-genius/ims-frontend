<!-- 全螢幕背景與居中容器 -->
<div 
  class="relative flex h-screen w-screen items-center justify-center bg-cover bg-center bg-no-repeat"
  style="background-image: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?q=80&w=1920&auto=format&fit=crop');"
>
  <!-- 暗色/淡色遮罩，增加背景圖質感與文字閱讀性 -->
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>

  <!-- 置中登入卡片 -->
  <div class="relative z-10 w-full max-w-md rounded-2xl bg-white/90 p-8 shadow-2xl backdrop-blur-md border border-white/20">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-slate-800">歡迎回到系統</h2>
      <p class="mt-1 text-sm text-slate-500">請輸入您的帳號密碼進行驗證</p>
    </div>

    <!-- 錯誤訊息提示區 -->
    <div *ngIf="errorMessage" class="mb-4 rounded-xl bg-red-50 p-3 text-sm text-red-600 border border-red-100 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
      </svg>
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email 欄位 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">電子郵件</label>
        <input
          type="email"
          formControlName="email"
          class="w-full rounded-xl border border-slate-300 bg-white/80 px-4 py-2.5 text-sm text-slate-800 transition focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
          placeholder="your@email.com"
        />
      </div>

      <!-- 密碼欄位 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">密碼</label>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-xl border border-slate-300 bg-white/80 px-4 py-2.5 text-sm text-slate-800 transition focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
          placeholder="••••••••"
        />
      </div>

      <!-- 登入按鈕 -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full rounded-xl bg-indigo-600 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/30 transition hover:bg-indigo-700 active:scale-[0.99] disabled:opacity-50 cursor-pointer"
      >
        {{ isLoading ? '登入驗證中...' : '登入系統' }}
      </button>
    </form>

    <!-- 前往註冊連結 -->
    <div class="mt-6 text-center text-sm text-slate-600">
      還沒有帳號嗎？
      <a routerLink="/register" class="font-semibold text-indigo-600 hover:underline">免費註冊帳號</a>
    </div>
  </div>
</div>
