name: Frontend CI/CD - Angular Tests

on:
  push:
    branches: [ "main" ]

# 1. 解決 Node 20 警告
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

# 2. 解決 Resource not accessible by integration 權限問題
permissions:
  contents: read
  checks: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run Angular Unit Tests
      run: npx ng test --watch=false --browsers=ChromeHeadless

    # 3. 測試通過後通知 Vercel Check
    - name: 'Notify Vercel'
      if: success()
      uses: 'vercel/repository-dispatch/actions/status@v1'
      with:
        name: 'Vercel - ims-frontend: Run Angular Unit Tests'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}