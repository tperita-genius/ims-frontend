name: Frontend CI - Angular Tests

# 觸發條件：當 main 分支有 push 或 pull request 時
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 如果你的前端是放在獨立資料夾，需要指定工作目錄
    # 假設前端在 ims-frontend 資料夾中：
    defaults:
      run:
        working-directory: ./ims-frontend

    steps:
    # 1. 檢出程式碼
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 設定 Node.js 環境
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # 請對應你目前開發使用的 Node 版本
        cache: 'npm'
        cache-dependency-path: ./ims-frontend/package-lock.json

    # 3. 安裝依賴套件
    - name: Install dependencies
      run: npm ci

    # 4. 執行 Angular 單元測試 (無頭模式)
    - name: Run Angular Unit Tests
      run: npx ng test --watch=false --browsers=ChromeHeadless